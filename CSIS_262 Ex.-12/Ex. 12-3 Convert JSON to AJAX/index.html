        $(document).ready(function() {
            $.ajax({
                type: "get",
                url: "team.json",
                dataType: "json",
                beforeSend: function() {
                    $("#team").append("<div>Getting data...</div>");
                },
                timeout: 10000,
                error: function(xhr, status, error) {
                    alert("Error: " + xhr.status + " - " + error);
                },
                success: function(data) {
                    $("#team").html("");
                    $.each(data, function() {
                        $.each(this, function(key, value) {
                            
                            $("#team").append(
                                "<img src='" + value.image + "'>" +
                                "<h3>" + value.full_name + "</h3>" +
                                "<h3>" + value.title + "</h3>" +
                                value.tag_line + "<p></p>"
                            );
                        })
                    });
                },
            });
        });
    </script>
