<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Flickr</title>
    <link href="main.css" rel="stylesheet">
    <script src="http://code.jquery.com/jquery-3.1.1.min.js"></script>

	<script>
	$(document).ready(function(){
			var url = "http://api.flickr.com/services/feeds/photos_public.gne?" +
	    			  "&format=json&jsoncallback=?&tags=waterfall,yosemite";
	
			$.getJSON(url, function(data){
				var html = "";
				$.each(data.items, function(i, item){
					html += "<h2>" + item.title + "</h2>";	
					//html += "<img src=" + item.media.m + ">";
					html += "<p>" + item.date_taken + "</p>";
					html += item.description;
					//html += "<p style='border-bottom: 3px dotted blue'></p>";
					//html = html.replace(
					//	"<p><a href=\"https://www.flickr.com/people/10588039@N08/\">taxidriverhk<\/a>" + 
					//	" posted a photo:<\/p>", "<p>Hello world</p>"
					//);
				});
				$("#photos").html(html);
			});          
        });
    </script>
</head>

<body>
<main>
	<h1>Yosemite waterfalls</h1>
	<div id="photos"></div>
</main>
</body>
</html>
